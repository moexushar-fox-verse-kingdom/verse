<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Miner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="preload" as="image" href="splash.webp">
<style>
html,body{margin:0;height:100%;background:#030a26}
#splash{position:fixed;inset:0;z-index:99999;overflow:hidden;background:#030a26;transition:opacity .45s ease;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-bg{position:absolute;inset:-4%;background:url(splash.webp) center/cover no-repeat;filter:blur(22px) brightness(.65)}
#splash .sp-stage{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:941/1672;transform:translateX(-50%)}
#splash .sp-stage>img{display:block;width:100%;height:100%;-webkit-user-drag:none;pointer-events:none}
#splash .sp-bar{position:absolute;left:24.2%;top:86.8%;width:51.3%;height:2.7%;min-height:16px;box-sizing:border-box;padding:3px;border-radius:99px;border:2px solid #2fd0ff;background:linear-gradient(#050d30,#071448);box-shadow:0 0 10px #1e9bff,0 0 26px rgba(30,144,255,.6),inset 0 0 8px rgba(0,0,0,.65)}
#splash .sp-fill{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 9px,rgba(255,255,255,0) 9px 18px) 0 0/36px 100%,linear-gradient(90deg,#139bff,#22f0ff);box-shadow:0 0 10px rgba(34,230,255,.75);animation:spmove .9s linear infinite}
@keyframes spmove{to{background-position:36px 0,0 0}}
#splash .sp-txt{position:absolute;left:0;right:0;top:90.6%;text-align:center;color:#bcdcff;font-size:clamp(11px,1.6vh,14px);font-weight:700;letter-spacing:.4px;text-shadow:0 0 8px rgba(30,144,255,.9)}
#splash .sp-txt b{color:#fff;font-weight:800}
@media (prefers-reduced-motion:reduce){#splash .sp-fill{animation:none}}
</style>
<script>
/* Live splash progress: real loading milestones (scripts, Telegram, Firebase, user data) drive the bar */
window.Splash=(function(){
  var MIN_MS=1200,MAX_MS=20000,t0=performance.now(),el,fill,num,msg;
  var target=0,shown=0,ceil=0,fin=false,gone=false,lastInt=-1,scripts=0,TOTAL_SCRIPTS=10;
  function set(p,text){if(fin)return;p=Math.min(97,p);if(p>target){target=p;ceil=Math.min(97,p+7)}if(text&&msg&&msg.textContent!==text)msg.textContent=text}
  function step(){scripts++;set(6+scripts*(40/TOTAL_SCRIPTS))}
  function done(){if(fin)return;fin=true;target=100}
  function tick(){
    if(gone)return;
    if(!el){el=document.getElementById('splash');if(el){fill=el.querySelector('.sp-fill');num=el.querySelector('.sp-num');msg=el.querySelector('.sp-msg')}}
    if(el){
      var now=performance.now();
      if(!fin&&now-t0>MAX_MS)done();
      var diff=target-shown;
      if(diff>0.05)shown+=Math.max(diff*0.08,0.15);                 /* ease toward real progress */
      else if(!fin&&shown<ceil)shown+=0.03;                         /* tiny creep so it never looks frozen */
      if(shown>100)shown=100;
      fill.style.width=shown.toFixed(2)+'%';
      var i=Math.floor(shown);if(i!==lastInt){lastInt=i;num.textContent=i+'%'}
      if(fin&&shown>=99.9&&now-t0>=MIN_MS){gone=true;el.classList.add('out');setTimeout(function(){el.remove()},500);return}
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return {set:set,step:step,done:done};
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js" onload="window.Splash&&Splash.step()"></script>
<link rel="stylesheet" href="style.css">
</head>
<body><div id="splash" aria-hidden="true"><div class="sp-bg"></div><div class="sp-stage"><img src="splash.webp" alt="" draggable="false" onload="window.Splash&&Splash.set(6)"><div class="sp-bar"><i class="sp-fill"></i></div><div class="sp-txt"><span class="sp-msg">Loading…</span> · <b class="sp-num">0%</b></div></div></div>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" onload="window.Splash&&Splash.step()"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js" onload="window.Splash&&Splash.step()"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
<script src="init.js" onload="window.Splash&&Splash.step()"></script>
<script src="assets.js" onload="window.Splash&&Splash.step()"></script>
<script src="firebase-config.js" onload="window.Splash&&Splash.step()"></script>
<script src="ads.js" onload="window.Splash&&Splash.step()"></script>
<script src="backend.js" onload="window.Splash&&Splash.step()"></script>
<script src="app.js" onload="window.Splash&&Splash.step()"></script>
<script src="fit.js" onload="window.Splash&&Splash.step()"></script>
</body></html>
